<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Barbearia do Cabeça</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --black: #0a0a0a;
      --dark: #141414;
      --gray: #1f1f1f;
      --border: #333;
      --white: #f5f5f5;
      --muted: #999;
      --purple: #8a2be2;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: var(--black);
      color: var(--white);
      line-height: 1.6;
      min-height: 100vh;
      position: relative;
      overflow-x: hidden;
    }

    /* Fundo Animado Roxo */
    .purple-bg-animation {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      z-index: -1;
      pointer-events: none;
      overflow: hidden;
      background: #0a0a0a;
    }

    .purple-orb {
      position: absolute;
      border-radius: 50%;
      filter: blur(80px);
      opacity: 0.45;
      animation: floatPurple 16s infinite ease-in-out alternate;
    }

    .purple-orb-1 {
      width: 400px;
      height: 400px;
      background: radial-gradient(circle, #8a2be2 0%, #4b0082 70%, transparent 100%);
      top: -100px;
      left: -100px;
    }

    .purple-orb-2 {
      width: 500px;
      height: 500px;
      background: radial-gradient(circle, #9370db 0%, #6a0dad 70%, transparent 100%);
      bottom: -150px;
      right: -100px;
      animation-delay: -5s;
    }

    @keyframes floatPurple {
      0% { transform: translate(0, 0) scale(1); }
      100% { transform: translate(60px, -60px) scale(1.1); }
    }

    header {
      position: sticky;
      top: 0;
      z-index: 100;
      background: rgba(10, 10, 10, 0.85);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border);
      padding: 1rem 1.5rem;
    }

    .header-inner {
      max-width: 1100px;
      margin: 0 auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .logo {
      font-size: 1.4rem;
      font-weight: 700;
      color: var(--white);
      text-decoration: none;
    }

    .logo span {
      font-weight: 300;
      color: var(--muted);
    }

    .hero {
      max-width: 1100px;
      margin: 0 auto;
      padding: 4rem 1.5rem 3rem;
      text-align: center;
    }

    .hero h1 {
      font-size: clamp(2.2rem, 6vw, 3.5rem);
      font-weight: 700;
      margin-bottom: 1rem;
    }

    .hero p {
      font-size: 1.15rem;
      color: var(--muted);
      margin-bottom: 2rem;
    }

    .booking-section {
      background: rgba(20, 20, 20, 0.75);
      backdrop-filter: blur(8px);
      border-top: 1px solid var(--border);
      border-bottom: 1px solid var(--border);
      padding: 3rem 1.5rem;
    }

    .booking-inner {
      max-width: 560px;
      margin: 0 auto;
    }

    .section-title {
      font-size: 1.5rem;
      font-weight: 600;
      margin-bottom: 1.5rem;
      text-align: center;
    }

    .form-group {
      margin-bottom: 1.25rem;
    }

    .form-group label {
      display: block;
      font-size: 0.85rem;
      color: var(--muted);
      margin-bottom: 0.4rem;
    }

    .form-group input,
    .form-group select {
      width: 100%;
      background: var(--gray);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 0.85rem 1rem;
      color: var(--white);
      font-size: 1rem;
      outline: none;
    }

    .form-group input:focus,
    .form-group select:focus {
      border-color: var(--purple);
    }

    .form-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1rem;
    }

    .btn {
      display: inline-block;
      background: var(--white);
      color: var(--black);
      padding: 0.9rem 2rem;
      border-radius: 8px;
      font-weight: 600;
      font-size: 1rem;
      border: none;
      cursor: pointer;
      width: 100%;
    }

    .btn:hover {
      opacity: 0.9;
    }

    .success-msg {
      display: none;
      text-align: center;
      padding: 2rem;
      background: var(--gray);
      border-radius: 12px;
      border: 1px solid var(--border);
    }

    .success-msg.show {
      display: block;
    }

    footer {
      text-align: center;
      padding: 2.5rem 1.5rem;
      color: var(--muted);
      font-size: 0.9rem;
    }
  </style>
</head>
<body>

  <div class="purple-bg-animation">
    <div class="purple-orb purple-orb-1"></div>
    <div class="purple-orb purple-orb-2"></div>
  </div>

  <header>
    <div class="header-inner">
      <a href="#" class="logo">BARBEARIA <span>cabeça</span></a>
    </div>
  </header>

  <section class="hero">
    <h1>Agende o seu corte de cabelo</h1>
    <p>Escolha seu melhor horário</p>
  </section>

  <section class="booking-section" id="agendar">
    <div class="booking-inner">
      <h2 class="section-title">Agendar Horário</h2>

      <form id="booking-form">
        <div class="form-group">
          <label for="nome">Seu nome</label>
          <input type="text" id="nome" placeholder="Digite seu nome" required>
        </div>

        <div class="form-group">
          <label for="telefone">WhatsApp</label>
          <input type="tel" id="telefone" placeholder="(81) 99999-9999" required>
        </div>

        <div class="form-group">
          <label for="servico">Serviço</label>
          <select id="servico" required>
            <option value="" disabled selected>Selecione o serviço</option>
            <option value="Corte de cabelo — R$ 30">Corte de cabelo — R$ 30</option>
            <option value="Sobrancelha — R$ 15">Sobrancelha — R$ 15</option>
            <option value="Barba — R$ 25">Barba — R$ 25</option>
            <option value="Combo Cabelo + Barba — R$ 50">Combo Cabelo + Barba — R$ 50</option>
          </select>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label for="data">Data</label>
            <input type="date" id="data" required>
          </div>
          <div class="form-group">
            <label for="horario">Horário</label>
            <select id="horario" required>
              <option value="" disabled selected>Escolha</option>
              <option value="07:00">07:00</option>
              <option value="08:30">08:30</option>
              <option value="09:00">09:00</option>
              <option value="10:30">10:30</option>
              <option value="11:00">11:00</option>
              <option value="11:30">11:30</option>
              <option value="14:00">14:00</option>
              <option value="14:30">14:30</option>
              <option value="15:00">15:00</option>
              <option value="15:30">15:30</option>
              <option value="16:00">16:00</option>
              <option value="16:30">16:30</option>
              <option value="17:00">17:00</option>
              <option value="17:30">17:30</option>
              <option value="18:00">18:00</option>
              <option value="19:00">19:00</option>
            </select>
          </div>
        </div>

        <button type="submit" class="btn">Confirmar agendamento</button>
      </form>

      <div class="success-msg" id="success">
        <h3>✓ Agendamento enviado!</h3>
        <p>No seu horário, pode comparecer ao salão.</p>
      </div>
    </div>
  </section>

  <footer>
    <p>Barbearia Cabeça</p>
  </footer>

  <!-- Scripts do Firebase Compat (Idênticos aos do Painel) -->
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
  <script>
    // Configuração exata do mesmo projeto do Painel (barbeariadocabe-a)
    const firebaseConfig = {
      apiKey: "AIzaSyCrrf2_g04s2Jp3ZbDgD3J7xF0Qv1Xk2M",
      authDomain: "barbeariadocabe-a.firebaseapp.com",
      databaseURL: "https://barbeariadocabe-a-default-rtdb.firebaseio.com",
      projectId: "barbeariadocabe-a",
      storageBucket: "barbeariadocabe-a.firebasestorage.app",
      messagingSenderId: "1063544666014",
      appId: "1:1063544666014:web:b5b6cb9ab0f8dccb6eeaf4c"
    };

    if (!firebase.apps.length) {
      firebase.initializeApp(firebaseConfig);
    }
    const db = firebase.database();

    // Função para obter data/hora atual em Brasília
    function obterDataHoraBrasilia() {
      const agora = new Date();
      const optionsDate = { timeZone: 'America/Sao_Paulo', year: 'numeric', month: '2-digit', day: '2-digit' };
      const optionsTime = { timeZone: 'America/Sao_Paulo', hour: '2-digit', minute: '2-digit', hour12: false };
      
      const partsDate = new Intl.DateTimeFormat('pt-BR', optionsDate).formatToParts(agora);
      const dia = partsDate.find(p => p.type === 'day').value;
      const mes = partsDate.find(p => p.type === 'month').value;
      const ano = partsDate.find(p => p.type === 'year').value;
      
      const dataISO = `${ano}-${mes}-${dia}`;
      
      const partesHora = new Intl.DateTimeFormat('pt-BR', optionsTime).formatToParts(agora);
      const hora = partesHora.find(p => p.type === 'hour').value;
      const minuto = partesHora.find(p => p.type === 'minute').value;
      
      return { dataISO, horaAtualStr: `${hora}:${minuto}` };
    }

    const { dataISO: hojeBrasilia, horaAtualStr } = obterDataHoraBrasilia();
    const inputData = document.getElementById('data');
    const selectHorario = document.getElementById('horario');
    
    inputData.min = hojeBrasilia;
    if (!inputData.value) {
      inputData.value = hojeBrasilia;
    }

    let agendamentosCache = [];
    
    db.ref('agendamentos').on('value', (snapshot) => {
      const dados = snapshot.val();
      agendamentosCache = dados ? Object.values(dados) : [];
      atualizarHorariosDisponiveis();
    });

    function atualizarHorariosDisponiveis() {
      const dataSelecionada = inputData.value;
      const horariosOcupados = agendamentosCache
        .filter(ag => ag.data === dataSelecionada)
        .map(ag => ag.horario);

      const eHoje = (dataSelecionada === hojeBrasilia);

      Array.from(selectHorario.options).forEach(opt => {
        if (opt.value === "") return;

        const horaBase = opt.value;
        let deveDesativar = false;

        if (eHoje && horaBase <= horaAtualStr) {
          deveDesativar = true;
        }

        if (horariosOcupados.includes(horaBase)) {
          deveDesativar = true;
        }

        if (deveDesativar) {
          opt.disabled = true;
          opt.style.display = 'none';
        } else {
          opt.disabled = false;
          opt.style.display = 'block';
        }
      });
    }

    inputData.addEventListener('change', atualizarHorariosDisponiveis);

    // Envio do formulário salvando no Firebase
    document.getElementById('booking-form').addEventListener('submit', function(e) {
      e.preventDefault();

      const nome = document.getElementById('nome').value.trim();
      const telefone = document.getElementById('telefone').value.trim();
      const servico = document.getElementById('servico').value;
      const data = inputData.value;
      const horario = selectHorario.value;

      if (!horario) {
        alert('Por favor, selecione um horário válido.');
        return;
      }

      const jaExiste = agendamentosCache.some(ag => ag.data === data && ag.horario === horario);
      if (jaExiste) {
        alert('Este horário acabou de ser reservado por outra pessoa! Escolha outro.');
        atualizarHorariosDisponiveis();
        return;
      }

      // Salva no Realtime Database do mesmo projeto do painel
      db.ref('agendamentos').push({ nome, telefone, servico, data, horario });
      
      this.style.display = 'none';
      document.getElementById('success').classList.add('show');
    });
  </script>
</body>
</html>
